<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#11152a"><title>Meme Tap 2.0 • Новое обновление</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090b18}body{overflow-x:hidden}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 15% 10%,#ff4fd822,transparent 28%),radial-gradient(circle at 85% 15%,#38e8ff22,transparent 25%),linear-gradient(135deg,#14132b,#08151e 55%,#26122d)}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);background:#101426ed;border:1px solid #ffffff18;border-radius:28px;padding:24px;box-shadow:0 25px 90px #0008;backdrop-filter:blur(14px)}.logo{font-size:44px;font-weight:1000;text-align:center;letter-spacing:-2px}.logo i{font-style:normal;background:linear-gradient(90deg,#ffdf4d,#ff4fd8,#51e4ff);-webkit-background-clip:text;color:transparent}.sub{color:#aeb7d4;text-align:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.tab,.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px;color:#fff;font-weight:800;background:#202640}.primary{background:linear-gradient(135deg,#715cff,#b23dff)}.danger{background:#d9425d}.input{width:100%;padding:14px;margin:7px 0;border-radius:14px;border:1px solid #ffffff16;background:#090d19;color:#fff;outline:none}.error{min-height:22px;color:#ff8295;font-size:14px}.game{max-width:980px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#101426d9;border:1px solid #ffffff12;border-radius:18px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(12px)}.brand{font-weight:1000}.coins{margin-left:auto;font-weight:1000;color:#ffe45c}.iconbtn{border:0;background:#242a45;color:#fff;border-radius:12px;padding:10px 12px}.hero{margin-top:14px;padding:12px;border-radius:26px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);border:1px solid #ffffff12}.hello{color:#aeb7d4;font-size:14px;margin:3px 4px 10px}.tapbox{position:relative;min-height:58vh;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#ffffff12,transparent 35%),linear-gradient(135deg,#1b1740,#0b2431,#31132d);border:1px solid #ffffff18}.tapbox:before,.tapbox:after{content:"";position:absolute;border-radius:50%;filter:blur(20px);opacity:.55}.tapbox:before{width:220px;height:220px;background:#ff4fc0;left:-80px;top:-80px}.tapbox:after{width:240px;height:240px;background:#34dfff;right:-100px;bottom:-100px}.meme{position:relative;z-index:2;width:min(70vw,330px);height:min(70vw,330px);max-width:330px;max-height:330px;border-radius:30px;object-fit:contain;background:#111;box-shadow:0 18px 0 #0007,0 25px 55px #0009;user-select:none;touch-action:manipulation;transition:transform .06s}.meme:active{transform:scale(.93) translateY(7px)}.float{position:absolute;z-index:4;font-size:25px;font-weight:1000;color:#ffe65c;text-shadow:0 2px 10px #000;pointer-events:none;animation:float .8s ease-out forwards}@keyframes float{to{transform:translateY(-100px) scale(1.2);opacity:0}}.desc{text-align:center;color:#c4cbe0;font-size:14px;margin:12px 4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#101426cc;border:1px solid #ffffff12;border-radius:16px;text-align:center;padding:11px}.stat b{font-size:19px;display:block}.stat small{color:#929ab5}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.panel{margin-top:10px}.shopgrid,.casegrid{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:#101426e8;border:1px solid #ffffff12}.thumb{width:64px;height:64px;border-radius:14px;object-fit:contain;background:#222}.itemmain{min-width:0;flex:1}.itemmain b{display:block}.itemmain small{display:block;color:#9ea6bf;margin-top:3px}.buy{padding:10px 12px;border:0;border-radius:12px;background:#735cff;color:#fff;font-weight:900}.buy:disabled{opacity:.45}.profile{background:#101426e8;border:1px solid #ffffff12;border-radius:18px;padding:16px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border:0}.muted{color:#a4acc4}.tiny{font-size:12px;color:#858da7}.note{font-size:12px;color:#838ba4;text-align:center;margin-top:12px;line-height:1.4}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal .card{max-height:90vh;overflow:auto}.casecard{padding:12px;border-radius:24px;background:#101426e8;border:1px solid #ffffff12;text-align:center}.caseimg{width:100%;max-width:420px;aspect-ratio:9/7;object-fit:cover;border-radius:20px;display:block;margin:auto;box-shadow:0 15px 35px #0008}.casebtn{width:100%;margin-top:10px}.case-result{display:none;margin-top:12px;padding:12px;border-radius:18px;background:#080b16;border:1px solid #ffffff16}.case-result.show{display:block}.dropimg{width:120px;height:120px;object-fit:cover;border-radius:22px;display:block;margin:8px auto}.case-opening{animation:casePulse .8s ease-in-out infinite alternate;filter:brightness(1.25)}@keyframes casePulse{from{transform:scale(.97) rotate(-1deg);filter:brightness(1)}to{transform:scale(1.04) rotate(1deg);filter:brightness(1.4)}}@media(max-width:620px){.menu{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.logo{font-size:36px}.tapbox{min-height:56vh}.game{padding:9px}.meme{width:min(74vw,310px);height:min(74vw,310px)}}
</style></head><body><div id="root"></div>
<script>
const DB='memeTap30_accounts_v1',SESSION='memeTap30_session_v1';
const memes=[
{id:'67',name:'67',income:1,price:0,desc:'да не смешно уже!',img:'assets/67.jpg'},
{id:'cheremsha',name:'Черемша',income:3,price:700,desc:'это животное а не растения',img:'assets/cheremsha.jpg'},
{id:'aboyudno',name:'Абооюдно',income:5,price:1467,desc:'Абооюдно брат',img:'assets/aboyudno.jpg'},
{id:'52',name:'52',income:7,price:2000,oldPrice:1700,desc:'да здравствует Петербург',img:'assets/52.jpg'},
{id:'68',name:'68',income:10,price:2500,desc:'он единственный нормальный',img:'assets/68.jpg'},
{id:'bu',name:'Бу',income:14,price:3100,desc:'не бойся я друг',img:'assets/bu.jpg'},
{id:'skebob',name:'Скебоб',income:20,price:4670,desc:'скебоб это скебоб',img:'assets/skebob.jpg'},
{id:'okak',name:'Окак',income:25,price:5600,desc:'ОкАк',img:'assets/okak.jpg'},
{id:'shrekis',name:'Шрекис',income:31,price:6100,desc:'сом бади вон',img:'assets/shrekis.jpg'},
{id:'abobus',name:'Абобус',income:670,price:3500000,desc:'Ту ту ту ту ту ту ту ту',img:'assets/abobus.jpg'},
{id:'pepe',name:'Pepe 🐸',income:320,price:2400000,desc:'лягушка легенда',img:'assets/pepe.jpg'},
{id:'roja',name:'Рожа',income:671,price:3600000,desc:'2007',img:'assets/roja.jpg'},
{id:'top1',name:'Это топ 1 игра',income:700,price:4300000,desc:'нет к сожалению',img:'assets/top1.jpg'},
{id:'cyber',name:'Кибер буханка',income:720,price:5000000,desc:'Илон маск',img:'assets/cyber.jpg'},
{id:'znak',name:'Знак',income:750,price:5300000,desc:'спасибо',img:'assets/znak.jpg'},
{id:'kishki',name:'Кишки',income:767,price:5700000,desc:'еда !!!!!',img:'assets/kishki.jpg'},
{id:'capy',name:'Капибара',income:790,price:100000000,desc:'хозяин легенда',img:'assets/capy.jpg'}];
const $=s=>document.querySelector(s);const getDB=()=>JSON.parse(localStorage.getItem(DB)||'{}');const setDB=x=>localStorage.setItem(DB,JSON.stringify(x));const session=()=>localStorage.getItem(SESSION);const acct=()=>{let n=session(),d=getDB();return n&&d[n]?d[n]:null};
function ensureGuest(){let d=getDB(),n=session()||'guest';if(!d[n])d[n]={name:n==='guest'?'Игрок':n,pass:'',email:'',coins:50,taps:0,selected:'67',owned:['67'],upgrade:0};setDB(d);localStorage.setItem(SESSION,n);return d[n]}
function saveLocal(a){let d=getDB();d[a.name]=a;setDB(d)}function save(a){saveLocal(a)}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function income(a){let m=memes.find(x=>x.id===a.selected)||memes[0];return m.income+a.upgrade}function level(a){return Math.floor(a.taps/100)+1}
function auth(){ensureGuest();game()}
function game(){let a=acct()||ensureGuest(),m=memes.find(x=>x.id===a.selected)||memes[0];document.body.className='app';document.getElementById('root').innerHTML=`<main class="game"><div class="top"><span class="brand">🌈 Meme Tap 2.0 • UPDATE</span><span class="coins">🪙 <span id="coins">${a.coins}</span></span><button class="iconbtn" id="account">👤</button></div><section class="hero"><div class="hello">Привет, <b>${esc(a.name)}</b>! Уровень ${level(a)}</div><div class="tapbox" id="tapbox"><img class="meme" id="meme" src="${m.img}" alt="${esc(m.name)}"><div id="floats"></div></div><div class="desc"><b id="mname">${esc(m.name)}</b> • <span id="mdesc">${esc(m.desc)}</span></div><div class="stats"><div class="stat"><b id="taps">${a.taps}</b><small>тапов</small></div><div class="stat"><b id="power">${income(a)}</b><small>монет за тап</small></div><div class="stat"><b id="owned">${a.owned.length}/${memes.length}</b><small>мемов</small></div></div><div class="menu"><button class="tab" id="shop">🛒 Магазин</button><button class="tab" id="cases">🎁 Кейсы</button><button class="tab" id="up">⬆️ Прокачка</button><button class="tab" id="profile">👤 Аккаунт</button></div><div class="panel" id="panel"></div></section></main>`;$('#tapbox').addEventListener('pointerdown',tap,{passive:false});$('#shop').onclick=shop;$('#cases').onclick=cases;$('#up').onclick=upgrade;$('#profile').onclick=profile}
function refresh(){let a=acct(),m=memes.find(x=>x.id===a.selected)||memes[0];$('#coins').textContent=a.coins;$('#taps').textContent=a.taps;$('#power').textContent=income(a);$('#owned').textContent=a.owned.length+'/'+memes.length;$('#meme').src=m.img;$('#mname').textContent=m.name;$('#mdesc').textContent=m.desc}
function tap(e){e.preventDefault();let a=acct(),g=income(a);a.coins+=g;a.taps++;save(a);refresh();let r=$('#tapbox').getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent='+'+g+' 🪙';f.style.left=(e.clientX-r.left-20)+'px';f.style.top=(e.clientY-r.top-20)+'px';$('#floats').appendChild(f);setTimeout(()=>f.remove(),700)}
function shop(){let a=acct();$('#panel').innerHTML=`<div class="shopgrid">${memes.map(m=>{let own=a.owned.includes(m.id),sel=a.selected===m.id;return `<div class="item"><img class="thumb" src="${m.img}"><div class="itemmain"><b>${esc(m.name)}</b><small>${m.income} 🪙/тап • ${esc(m.desc)}${m.oldPrice?` • <span style="color:#8f97b0;text-decoration:line-through">стоял ${m.oldPrice}</span>`:''}</small></div><button class="buy" data-id="${m.id}" ${sel||(!own&&a.coins<m.price)?'disabled':''}>${sel?'Выбран':own?'Выбрать':'🪙 '+m.price.toLocaleString('ru-RU')}</button></div>`}).join('')}</div>`;document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let a=acct(),m=memes.find(x=>x.id===b.dataset.id);if(a.owned.includes(m.id))a.selected=m.id;else if(a.coins>=m.price){a.coins-=m.price;a.owned.push(m.id);a.selected=m.id}save(a);game();shop()})}
function openCase(kind){let a=acct(),price=kind==='bomzh'?1000:1000000;if(a.coins<price)return alert('Не хватает монет 🪙');a.coins-=price;save(a);const ids=kind==='bomzh'?memes.slice(1,9):memes.slice(1);let key=kind==='bomzh'?'caseBomzhIndex':'caseRichIndex';let idx=Number(a[key]||0)%ids.length;let m=ids[idx];a[key]=idx+1;save(a);let modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="card" style="text-align:center"><h2>${kind==='bomzh'?'🧳 Кейс «Бомж»':'💎 Кейс «Богатых»'}</h2><img id="caseOpening" class="caseimg case-opening" src="assets/${kind==='bomzh'?'case_bomzh':'case_rich'}.jpg"><p class="muted">Открываем кейс...</p></div>`;document.body.appendChild(modal);setTimeout(()=>{modal.querySelector('#caseOpening').classList.remove('case-opening');modal.querySelector('#caseOpening').src=m.img;modal.querySelector('.muted').innerHTML=`🎉 Выпал <b>${esc(m.name)}</b>!<br><small>${m.income} 🪙/тап</small>`;a.owned=a.owned.includes(m.id)?a.owned:a.owned.concat(m.id);save(a);let btn=document.createElement('button');btn.className='primary casebtn';btn.textContent='Забрать';modal.querySelector('.card').appendChild(btn);btn.onclick=()=>{modal.remove();game();cases()};},1300)}
function cases(){let a=acct();$('#panel').innerHTML=`<div class="casegrid"><div class="casecard"><h3>🧳 Кейс «Бомж»</h3><img class="caseimg" src="assets/case_bomzh.jpg"><p class="muted">Гарантированно выдаёт персонажа по очереди: от Черемши до Шрекиса</p><button class="primary casebtn" id="openBomzh">Открыть за 🪙 1 000</button></div><div class="casecard"><h3>💎 Кейс «Богатых»</h3><img class="caseimg" src="assets/case_rich.jpg"><p class="muted">Гарантированно выдаёт персонажа по очереди: от Черемши до последнего</p><button class="primary casebtn" id="openRich">Открыть за 🪙 1 000 000</button></div></div>`;$('#openBomzh').onclick=()=>openCase('bomzh');$('#openRich').onclick=()=>openCase('rich')}
function upgrade(){let a=acct(),cost=100*(a.upgrade+1);$('#panel').innerHTML=`<div class="profile"><h3>⬆️ Прокачка</h3><p>Текущий бонус: <b>+${a.upgrade}</b> монет за тап</p><p>Следующий бонус: <b>+${a.upgrade+1}</b></p><p>Цена: 🪙 <b>${cost.toLocaleString('ru-RU')}</b></p><button class="primary" id="buy" ${a.coins<cost?'disabled':''}>Купить улучшение</button></div>`;$('#buy').onclick=()=>{let a=acct(),cost=100*(a.upgrade+1);if(a.coins>=cost){a.coins-=cost;a.upgrade++;save(a);game();upgrade()}}}
function profile(){let a=acct();$('#panel').innerHTML=`<div class="profile"><h3>👤 Аккаунт</h3><div class="row"><span>Имя</span><b>${esc(a.name)}</b></div><div class="row"><span>Электронная почта</span><b>${a.email?esc(a.email):'<span class="muted">не добавлена</span>'}</b></div><div class="row"><span>Уровень</span><b>${level(a)}</b></div><div class="row"><span>Тапы</span><b>${a.taps}</b></div><div class="row"><span>Монеты</span><b>${a.coins.toLocaleString('ru-RU')}</b></div><button class="primary" id="email">📧 ${a.email?'Изменить':'Добавить'} почту</button></div>`;$('#email').onclick=()=>emailModal()}
function emailModal(){let a=acct(),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h2>📧 Электронная почта</h2><p class="muted">Она необязательна для игры.</p><input class="input" id="emailin" type="email" placeholder="name@example.com" value="${esc(a.email||'')}"><div class="error" id="emerr"></div><button class="primary" id="saveemail">Сохранить</button><button class="secondary" id="closeemail" style="width:100%;margin-top:8px">Отмена</button></div>`;document.body.appendChild(m);$('#closeemail').onclick=()=>m.remove();$('#saveemail').onclick=()=>{let v=$('#emailin').value.trim();if(v&&!/^\S+@\S+\.\S+$/.test(v))return $('#emerr').textContent='Проверь адрес электронной почты.';a.email=v;save(a);m.remove();profile()}}
ensureGuest();auth();
</script></body></html>
