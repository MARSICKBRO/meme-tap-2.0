<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#11152a"><title>Meme Tap 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090b18}body{overflow-x:hidden}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 15% 10%,#ff4fd822,transparent 28%),radial-gradient(circle at 85% 15%,#38e8ff22,transparent 25%),linear-gradient(135deg,#14132b,#08151e 55%,#26122d)}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);background:#101426ed;border:1px solid #ffffff18;border-radius:28px;padding:24px;box-shadow:0 25px 90px #0008;backdrop-filter:blur(14px)}.logo{font-size:44px;font-weight:1000;text-align:center;letter-spacing:-2px}.logo i{font-style:normal;background:linear-gradient(90deg,#ffdf4d,#ff4fd8,#51e4ff);-webkit-background-clip:text;color:transparent}.sub{color:#aeb7d4;text-align:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.tab,.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px;color:#fff;font-weight:800;background:#202640}.primary{background:linear-gradient(135deg,#715cff,#b23dff)}.danger{background:#d9425d}.input{width:100%;padding:14px;margin:7px 0;border-radius:14px;border:1px solid #ffffff16;background:#090d19;color:#fff;outline:none}.input:focus{border-color:#8d7aff}.error{min-height:22px;color:#ff8295;font-size:14px}.game{max-width:980px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#101426d9;border:1px solid #ffffff12;border-radius:18px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(12px)}.brand{font-weight:1000}.coins{margin-left:auto;font-weight:1000;color:#ffe45c}.iconbtn{border:0;background:#242a45;color:#fff;border-radius:12px;padding:10px 12px}.hero{margin-top:14px;padding:12px;border-radius:26px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);border:1px solid #ffffff12}.hello{color:#aeb7d4;font-size:14px;margin:3px 4px 10px}.tapbox{position:relative;min-height:58vh;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#ffffff12,transparent 35%),linear-gradient(135deg,#1b1740,#0b2431,#31132d);border:1px solid #ffffff18}.tapbox:before,.tapbox:after{content:"";position:absolute;border-radius:50%;filter:blur(20px);opacity:.55}.tapbox:before{width:220px;height:220px;background:#ff4fc0;left:-80px;top:-80px}.tapbox:after{width:240px;height:240px;background:#34dfff;right:-100px;bottom:-100px}.meme{position:relative;z-index:2;width:min(70vw,330px);height:min(70vw,330px);max-width:330px;max-height:330px;border-radius:30px;object-fit:cover;box-shadow:0 18px 0 #0007,0 25px 55px #0009;user-select:none;touch-action:manipulation;transition:transform .06s}.meme:active{transform:scale(.93) translateY(7px)}.float{position:absolute;z-index:4;font-size:25px;font-weight:1000;color:#ffe65c;text-shadow:0 2px 10px #000;pointer-events:none;animation:float .8s ease-out forwards}@keyframes float{to{transform:translateY(-100px) scale(1.2);opacity:0}}.desc{text-align:center;color:#c4cbe0;font-size:14px;margin:12px 4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#101426cc;border:1px solid #ffffff12;border-radius:16px;text-align:center;padding:11px}.stat b{font-size:19px;display:block}.stat small{color:#929ab5}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.panel{margin-top:10px}.shopgrid{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:#101426e8;border:1px solid #ffffff12}.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#222}.itemmain{min-width:0;flex:1}.itemmain b{display:block}.itemmain small{display:block;color:#9ea6bf;margin-top:3px}.buy{padding:10px 12px;border:0;border-radius:12px;background:#735cff;color:#fff;font-weight:900}.buy:disabled{opacity:.45}.profile{background:#101426e8;border:1px solid #ffffff12;border-radius:18px;padding:16px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border:0}.muted{color:#a4acc4}.tiny{font-size:12px;color:#858da7}.note{font-size:12px;color:#838ba4;text-align:center;margin-top:12px;line-height:1.4}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal .card{max-height:90vh;overflow:auto}@media(max-width:520px){.logo{font-size:36px}.tapbox{min-height:56vh}.game{padding:9px}.menu{grid-template-columns:1fr 1fr 1fr}.meme{width:min(74vw,310px);height:min(74vw,310px)}}
</style></head><body><div id="root"></div>
<script>
const DB='memeTap20_accounts_v2',SESSION='memeTap20_session_v2';
const memes=[
{id:'67',name:'67',income:1,price:0,desc:'да не смешно уже!',img:'assets/67.jpeg'},
{id:'cheremsha',name:'Черемша',income:5,price:150,desc:'это животное а не растения',img:'assets/cheremsha.jpeg'},
{id:'aboyudno',name:'Абооюдно',income:15,price:220,desc:'Абооюдно брат',img:'assets/aboyudno.jpeg'},
{id:'52',name:'52',income:19,price:300,desc:'да здравствует Петербург',img:'assets/52.png'},
{id:'68',name:'68',income:25,price:440,desc:'он единственный нормальный',img:'assets/68.png'},
{id:'bu',name:'Бу',income:35,price:520,desc:'не бойся я друг',img:'assets/bu.jpeg'},
{id:'skebob',name:'Скебоб',income:50,price:670,desc:'скебоб это скебоб',img:'assets/skebob.jpeg'},
{id:'okak',name:'Окак',income:67,price:950,desc:'ОкАк',img:'assets/okak.jpeg'},
{id:'shrekis',name:'Шрекис',income:85,price:1250,desc:'сом бади вон',img:'assets/shrekis.jpeg'},
{id:'abobus',name:'Абобус',income:1000,price:2500,desc:'Ту ту ту ту ту ту ту ту',img:'assets/abobus.jpeg'}];
const $=s=>document.querySelector(s);const getDB=()=>JSON.parse(localStorage.getItem(DB)||'{}');const setDB=x=>localStorage.setItem(DB,JSON.stringify(x));const session=()=>localStorage.getItem(SESSION);const acct=()=>{let n=session(),d=getDB();return n&&d[n]?d[n]:null};
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function save(a){let d=getDB();d[a.name]=a;setDB(d)}
function auth(){let a=acct();if(a)return game();document.body.className='app';document.getElementById('root').innerHTML=`<div class="screen"><div class="card"><div class="logo">Meme <i>Tap</i> 2.0</div><p class="sub">Тапай мемы. Копи монеты. Открывай коллекцию.</p><div class="tabs"><button class="tab" id="li">Вход</button><button class="tab" id="reg">Регистрация</button><button class="tab" id="demo">Демо</button></div><div id="authbox"></div><div class="note">При регистрации нужны только имя и пароль. Электронную почту можно добавить позже в аккаунте.</div></div></div>`;renderAuth('login');$('#li').onclick=()=>renderAuth('login');$('#reg').onclick=()=>renderAuth('reg');$('#demo').onclick=()=>{let d=getDB(),n='Демо';d[n] ||= {name:n,pass:'',email:'',coins:50,taps:0,selected:'67',owned:['67'],upgrade:0};setDB(d);localStorage.setItem(SESSION,n);game()}}
function renderAuth(mode){$('#authbox').innerHTML=`<input class="input" id="name" maxlength="20" placeholder="Имя"><input class="input" id="pass" type="password" maxlength="60" placeholder="Пароль"><div class="error" id="err"></div><button class="primary" id="go">${mode==='reg'?'Создать аккаунт':'Войти'}</button>`;$('#go').onclick=()=>{let n=$('#name').value.trim(),p=$('#pass').value,d=getDB();if(!n||p.length<4)return $('#err').textContent='Введи имя и пароль от 4 символов.';if(mode==='reg'){if(d[n])return $('#err').textContent='Это имя уже занято.';d[n]={name:n,pass:p,email:'',coins:50,taps:0,selected:'67',owned:['67'],upgrade:0};setDB(d);localStorage.setItem(SESSION,n);game()}else{if(!d[n]||d[n].pass!==p)return $('#err').textContent='Неверное имя или пароль.';localStorage.setItem(SESSION,n);game()}}}
function income(a){let m=memes.find(x=>x.id===a.selected)||memes[0];return m.income+a.upgrade}function level(a){return Math.floor(a.taps/100)+1}
function game(){let a=acct();if(!a)return auth();document.body.className='app';let m=memes.find(x=>x.id===a.selected)||memes[0];document.getElementById('root').innerHTML=`<main class="game"><div class="top"><span class="brand">🌈 Meme Tap 2.0</span><span class="coins">🪙 <span id="coins">${a.coins}</span></span><button class="iconbtn" id="account">👤</button></div><section class="hero"><div class="hello">Привет, <b>${esc(a.name)}</b>! Уровень ${level(a)}</div><div class="tapbox" id="tapbox"><img class="meme" id="meme" src="${m.img}" alt="${esc(m.name)}"><div id="floats"></div></div><div class="desc"><b id="mname">${esc(m.name)}</b> • <span id="mdesc">${esc(m.desc)}</span></div><div class="stats"><div class="stat"><b id="taps">${a.taps}</b><small>тапов</small></div><div class="stat"><b id="power">${income(a)}</b><small>монет за тап</small></div><div class="stat"><b id="owned">${a.owned.length}/10</b><small>мемов</small></div></div><div class="menu"><button class="tab" id="shop">🛒 Магазин</button><button class="tab" id="up">⬆️ Прокачка</button><button class="tab" id="profile">👤 Аккаунт</button></div><div class="panel" id="panel"></div></section></main>`;$('#tapbox').addEventListener('pointerdown',tap,{passive:false});$('#shop').onclick=shop;$('#up').onclick=upgrade;$('#profile').onclick=profile}
function refresh(){let a=acct(),m=memes.find(x=>x.id===a.selected)||memes[0];$('#coins').textContent=a.coins;$('#taps').textContent=a.taps;$('#power').textContent=income(a);$('#owned').textContent=a.owned.length+'/10';$('#meme').src=m.img;$('#mname').textContent=m.name;$('#mdesc').textContent=m.desc}
function tap(e){e.preventDefault();let a=acct(),g=income(a);a.coins+=g;a.taps++;save(a);refresh();let r=$('#tapbox').getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent='+'+g+' 🪙';f.style.left=(e.clientX-r.left-20)+'px';f.style.top=(e.clientY-r.top-20)+'px';$('#floats').appendChild(f);setTimeout(()=>f.remove(),700)}
function shop(){let a=acct();$('#panel').innerHTML=`<div class="shopgrid">${memes.map(m=>{let own=a.owned.includes(m.id),sel=a.selected===m.id;return `<div class="item"><img class="thumb" src="${m.img}"><div class="itemmain"><b>${esc(m.name)}</b><small>${m.income} 🪙/тап • ${esc(m.desc)}</small></div><button class="buy" data-id="${m.id}" ${sel||(!own&&a.coins<m.price)?'disabled':''}>${sel?'Выбран':own?'Выбрать':'🪙 '+m.price}</button></div>`}).join('')}</div>`;document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let a=acct(),m=memes.find(x=>x.id===b.dataset.id);if(a.owned.includes(m.id))a.selected=m.id;else if(a.coins>=m.price){a.coins-=m.price;a.owned.push(m.id);a.selected=m.id}save(a);game();shop()})}
function upgrade(){let a=acct(),cost=100*(a.upgrade+1);$('#panel').innerHTML=`<div class="profile"><h3>⬆️ Прокачка</h3><p>Текущий бонус: <b>+${a.upgrade}</b> монет за тап</p><p>Следующий бонус: <b>+${a.upgrade+1}</b></p><p>Цена: 🪙 <b>${cost}</b></p><button class="primary" id="buy" ${a.coins<cost?'disabled':''}>Купить улучшение</button></div>`;$('#buy').onclick=()=>{let a=acct(),cost=100*(a.upgrade+1);if(a.coins>=cost){a.coins-=cost;a.upgrade++;save(a);game();upgrade()}}}
function profile(){let a=acct();$('#panel').innerHTML=`<div class="profile"><h3>👤 Аккаунт</h3><div class="row"><span>Имя</span><b>${esc(a.name)}</b></div><div class="row"><span>Электронная почта</span><b>${a.email?esc(a.email):'<span class="muted">не добавлена</span>'}</b></div><div class="row"><span>Уровень</span><b>${level(a)}</b></div><div class="row"><span>Тапы</span><b>${a.taps}</b></div><div class="row"><span>Монеты</span><b>${a.coins}</b></div><button class="primary" id="email">📧 ${a.email?'Изменить':'Добавить'} почту</button><button class="danger" id="logout" style="width:100%;margin-top:8px">Выйти</button></div>`;$('#email').onclick=()=>emailModal();$('#logout').onclick=()=>{localStorage.removeItem(SESSION);auth()}}
function emailModal(){let a=acct();let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h2>📧 Электронная почта</h2><p class="muted">Она необязательна для игры.</p><input class="input" id="emailin" type="email" placeholder="name@example.com" value="${esc(a.email||'')}"><div class="error" id="emerr"></div><button class="primary" id="saveemail">Сохранить</button><button class="secondary" id="closeemail" style="width:100%;margin-top:8px">Отмена</button></div>`;document.body.appendChild(m);$('#closeemail').onclick=()=>m.remove();$('#saveemail').onclick=()=>{let v=$('#emailin').value.trim();if(v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return $('#emerr').textContent='Проверь адрес электронной почты.';a.email=v;save(a);m.remove();profile()}}
auth();
</script></body></html>
